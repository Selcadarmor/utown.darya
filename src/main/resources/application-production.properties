# Database Setting
spring.datasource.url=jdbc:mysql://shortline.proxy.rlwy.net:35649/${MYSQLDATABASE}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.url=${FLYWAY_URL:jdbc:mysql://shortline.proxy.rlwy.net:35649/${MYSQLDATABASE}?sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.flyway.user=${MYSQLUSER}
spring.flyway.password=${MYSQLPASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=30000
