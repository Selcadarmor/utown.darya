# Change username and password to match your local database
# Then add this file to .gitignore to avoid sharing sensitive credentials

# Database settings
spring.datasource.url=${URL}
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}

# JWT configuration (use 256-bit minimum secure keys)
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS}

aws.region=ap-southeast-2
aws.s3.bucket=selcadarmor
aws.credentials.access-key=${LOCAL_ACCESS_KEY}
aws.credentials.secret-key=${LOCAL_SECRET_KEY}
